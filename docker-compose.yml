services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ebuddy
      POSTGRES_USER: ebuddy
      POSTGRES_PASSWORD: ebuddy
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebuddy -d ebuddy"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ebuddy
      DB_USERNAME: ebuddy
      DB_PASSWORD: ebuddy
      REDIS_HOST: redis
      JWT_SECRET: replace-with-a-secret-at-least-256-bits
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  pgdata:
