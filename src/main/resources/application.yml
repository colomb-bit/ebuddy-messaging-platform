server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never

spring:
  application:
    name: ebuddy-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ebuddy}
    username: ${SPRING_DATASOURCE_USERNAME:ebuddy}
    password: ${SPRING_DATASOURCE_PASSWORD:ebuddy}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 3000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    baseline-version: 0
    locations: classpath:db/migration

  data:
    redis:
      url: ${REDIS_URL:redis://${SPRING_DATA_REDIS_HOST:localhost}:${SPRING_DATA_REDIS_PORT:6379}}
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2s
      repositories:
        enabled: false

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

  websocket:
    max-text-message-size: 65536

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    redis:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true

ebuddy:
  jwt:
    secret: ${JWT_SECRET:local-only-development-secret-32-bytes-minimum}
    ttl: ${JWT_TTL:PT24H}
  j2me:
    poll-timeout-seconds: ${J2ME_POLL_TIMEOUT:25}
    max-items: 20
    max-body-bytes: 8192
