server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: ${HTTP_MAX_THREADS:50}
      min-spare: ${HTTP_MIN_SPARE_THREADS:2}
    accept-count: ${HTTP_ACCEPT_COUNT:100}
    connection-timeout: ${HTTP_CONNECTION_TIMEOUT:15s}
  error:
    include-message: never

spring:
  application:
    name: ebuddy-backend

  datasource:
    url: jdbc:postgresql://dpg-dan3oertqb8s73afvjag-a/ebuddy
    username: ${SPRING_DATASOURCE_USERNAME:ebuddy_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 2000
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 300000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    baseline-version: 0
    locations: classpath:db/migration

  data:
    redis:
      url: ${REDIS_URL:redis://${SPRING_DATA_REDIS_HOST:localhost}:${SPRING_DATA_REDIS_PORT:6379}}
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2s
      repositories:
        enabled: false

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

  websocket:
    max-text-message-size: 65536

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    redis:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true

ebuddy:
  jwt:
    secret: ${JWT_SECRET:local-only-development-secret-32-bytes-minimum}
    ttl: ${JWT_TTL:PT24H}
  j2me:
    poll-timeout-seconds: ${J2ME_POLL_TIMEOUT:25}
    max-items: 20
    max-body-bytes: 8192
