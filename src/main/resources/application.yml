server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never

spring:
  application:
    name: ebuddy-backend

  datasource:
    # Must be a JDBC URL, for example:
    # jdbc:postgresql://host:5432/ebuddy
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 3000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Explicitly reuse the same Render datasource as Hikari/JPA.
    url: ${SPRING_DATASOURCE_URL}
    user: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  data:
    redis:
      url: ${REDIS_URL:redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

  websocket:
    max-text-message-size: 65536

management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.probes.enabled: true

ebuddy:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-256-bit-secret-change-me}
    ttl: ${JWT_TTL:PT24H}
  j2me:
    poll-timeout-seconds: ${J2ME_POLL_TIMEOUT:25}
    max-items: 20
    max-body-bytes: 8192
